name: Build Nubo Pass

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            script: "dist:mac:arm64:dev"
          - os: ubuntu-latest
            script: "dist:linux:x64"
          - os: windows-latest
            script: "dist:win:x64"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build distributable
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nubo-pass-${{ matrix.os }}
          path: |
            out/*.dmg
            out/*.AppImage
            out/*.snap
            out/*.msix
            out/*.appx
            out/*.exe
          if-no-files-found: warn
          retention-days: 14
